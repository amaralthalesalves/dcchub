# Testes a cada push no main e em todo PR. Sem dependências: só Python (biblioteca padrão), Node e o Chrome
# que já vem no runner do GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]  # a menor versão suportada (README) e a da imagem Docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes do servidor, sync e moderação
        run: python -m unittest discover -s tests -v

  frontend:
    name: Front-end (sintaxe, .ics e navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # o e2e usa o WebSocket nativo do Node 22+
      - name: Sintaxe do JavaScript
        run: for f in static/*.js tests/*.mjs; do node --check "$f"; done
      - name: Gerador de .ics da grade
        run: node --test tests/test_ics.mjs
      - name: Ponta a ponta no Chrome (banco de demonstração)
        run: |
          python3 tests/seed_demo.py "$RUNNER_TEMP/demo.db"
          DCCHUB_DB="$RUNNER_TEMP/demo.db" PORT=8766 python3 app.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8766/ > /dev/null && break; sleep 1; done
          node tests/e2e_browser.mjs http://localhost:8766
      - name: Log do servidor (se falhar)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  docker:
    name: Imagem Docker (sobe e responde)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Monta a imagem
        run: docker build -t dcchub-ci .
      # a imagem é o que vai para a VM: os testes acima rodam no repositório, não nela (um módulo fora do COPY já
      # derrubou um deploy com todos os testes verdes)
      - name: Sobe com a configuração de produção e consulta
        run: |
          docker run -d --name dcchub -p 8767:8000 -e DCCHUB_TRUST_PROXY=1 -e DCCHUB_EMAIL_LOGIN=1 \
            -e DCCHUB_ADMIN_TOKEN=ci -e DCCHUB_MOD_EMAIL=mod@exemplo.org dcchub-ci
          for i in $(seq 1 30); do curl -sf http://localhost:8767/api/health > /dev/null && break; sleep 1; done
          test "$(curl -s http://localhost:8767/api/health)" = '{"ok":true}'
          curl -sf http://localhost:8767/ | grep -q '<script src="app.js"'
          curl -sf http://localhost:8767/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8767/api/bootstrap)" = 401  # acesso restrito
          docker exec dcchub python3 -c "import app, email_login, moderation, mod_notify"
          if docker exec dcchub python3 scripts/send_backup.py x.enc; then echo "sem SMTP deveria recusar"; exit 1; fi
      - name: Log do container (se falhar)
        if: failure()
        run: docker logs dcchub || true
