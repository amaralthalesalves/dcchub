# DCCHub + Caddy (HTTPS automático via Let's Encrypt) numa VM qualquer (Oracle Always Free, GCP e2-micro…).
#   cd deploy && cp .env.example .env  (edite DOMAIN e DCCHUB_ADMIN_TOKEN)  &&  docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      DCCHUB_TRUST_PROXY: "1"            # o IP real vem do Caddy (X-Forwarded-For)
      DCCHUB_ADMIN_TOKEN: ${DCCHUB_ADMIN_TOKEN:-}
      DCCHUB_ACCESS_CODES: ${DCCHUB_ACCESS_CODES:-}   # código(s) da comunidade; vazio = sem código
      # acesso por código enviado ao e-mail @ufmg.br (o e-mail não é guardado)
      DCCHUB_EMAIL_LOGIN: ${DCCHUB_EMAIL_LOGIN:-}
      DCCHUB_DOCENTE_LOGIN: ${DCCHUB_DOCENTE_LOGIN:-}   # modo docente; vazio = desligado
      DCCHUB_SMTP_HOST: ${DCCHUB_SMTP_HOST:-}
      DCCHUB_SMTP_PORT: ${DCCHUB_SMTP_PORT:-587}
      DCCHUB_SMTP_USER: ${DCCHUB_SMTP_USER:-}
      DCCHUB_SMTP_PASSWORD: ${DCCHUB_SMTP_PASSWORD:-}
      DCCHUB_SMTP_FROM: ${DCCHUB_SMTP_FROM:-}
      DCCHUB_EMAIL_EPOCH: ${DCCHUB_EMAIL_EPOCH:-1}
      DCCHUB_EMAIL_DAILY_LIMIT: ${DCCHUB_EMAIL_DAILY_LIMIT:-250}
      # avisos à moderação quando algo entra na fila (mesmo SMTP); o link do painel usa o domínio
      DCCHUB_MOD_EMAIL: ${DCCHUB_MOD_EMAIL:-}
      DCCHUB_PUBLIC_URL: https://${DOMAIN}
      # cópia diária do backup, criptografada, por e-mail (deploy/backup.sh; a senha fica só no .env, fora do container)
      DCCHUB_BACKUP_EMAIL: ${DCCHUB_BACKUP_EMAIL:-}
    volumes:
      - dcchub-var:/app/var              # banco SQLite + chave secreta: é ISTO que precisa de backup
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      REDIRECT_FROM: ${REDIRECT_FROM:-}   # endereços antigos que redirecionam para o DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  dcchub-var:
  caddy-data:
